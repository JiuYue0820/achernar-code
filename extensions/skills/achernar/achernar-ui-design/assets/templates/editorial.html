<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Margin — Notes & observations</title><style>
:root{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--soft:#eeefeb;--ink:#242623;--muted:#666b63;--line:#dcded7;--accent:#3e604e;--inverse:#fff;--shadow:0 8px 32px #20251b0a}
:root[data-theme=dark]{color-scheme:dark;--bg:#141314;--surface:#1d1c1d;--soft:#292829;--ink:#e9e7e8;--muted:#a5a3a4;--line:#393739;--accent:#b4c9b6;--inverse:#1d251e;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button,a,input,select,summary{outline-offset:4px}a{color:inherit}button{border:0;background:transparent;border-radius:6px;padding:9px 13px}button:hover{background:var(--soft)}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}:focus-visible{outline:2px solid var(--accent)}input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}input[type=search]{width:100%;max-width:300px}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4vw,48px);line-height:1.1;letter-spacing:-1.4px;font-weight:600}h2{font-size:20px;line-height:1.4;font-weight:600}h3{font-size:17px;font-weight:600}small,.muted{color:var(--muted)}small{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:600;color:var(--muted)}.brand{font-size:19px;font-weight:600;letter-spacing:-.7px;text-decoration:none}.theme{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.theme svg{width:17px;height:17px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:23px 0;border-bottom:1px solid var(--line)}.heading{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:52px 0 32px}.heading p{margin-top:16px;max-width:55ch;color:var(--muted)}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.filters{display:flex;gap:4px;flex-wrap:wrap}.filters button{padding:7px 14px;font-size:13px}.page{max-width:1200px;padding:0 36px 40px;margin:auto}.empty{padding:40px;color:var(--muted)}[hidden]{display:none!important}.foot{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}::selection{background:var(--ink);color:var(--bg)}@media(max-width:720px){.page{padding:0 20px 30px}.heading{margin:36px 0 28px;align-items:start;flex-direction:column}.top{padding:17px 0}input[type=search]{max-width:none}.toolbar{align-items:stretch}.filters{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.masthead{padding:60px 0 42px;display:grid;grid-template-columns:1.5fr 1fr;align-items:end;gap:60px}.masthead h1{font-size:clamp(48px,7vw,82px);font-weight:400;letter-spacing:-3px;margin:15px 0}.masthead p{max-width:32ch;color:var(--muted)}.edition{padding-bottom:12px}.editorial-toolbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0}.articles{display:grid;grid-template-columns:1.35fr 1fr;gap:0 54px}.article{padding:32px 0;border-bottom:1px solid var(--line)}.article:first-child{grid-row:span 2}.article summary{list-style:none}.article summary::-webkit-details-marker{display:none}.article h2{font-size:27px;letter-spacing:-.6px;line-height:1.25;margin:14px 0}.article:first-child h2{font-size:37px}.article p{color:var(--muted);margin:16px 0}.article .read{display:inline-block;font-size:12px;color:var(--accent);margin-top:22px}.article .read::after{content:' +';padding-left:10px}.article[open] .read::after{content:' −'}.body{border-top:1px solid var(--line);margin-top:24px;padding-top:8px}.reading-count{margin-top:22px;font-size:12px;color:var(--muted)}@media(max-width:720px){.masthead{padding:36px 0;grid-template-columns:1fr;gap:20px}.masthead h1{letter-spacing:-2px}.articles{grid-template-columns:1fr}.article:first-child h2{font-size:29px}.article h2{font-size:24px}.article{padding:26px 0}.article:first-child{grid-row:auto}}
</style></head><body><main class="page"><header class="top"><a class="brand" href="#main">Margin /</a><button class="theme" id="theme" type="button" aria-label="Use dark theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span>Theme</span></button></header><section class="masthead" id="main"><div><span class="eyebrow">An independent notebook</span><h1>Worth a<br>closer look.</h1></div><div class="edition"><p>Small observations on making things that deserve to stay.</p><p style="margin-top:24px"><small>Issue 01 · September 2026</small></p></div></section><div class="toolbar editorial-toolbar"><div class="filters" aria-label="Article category"><button data-category="All" aria-pressed="true">All notes</button><button data-category="Design" aria-pressed="false">Design</button><button data-category="Practice" aria-pressed="false">Practice</button></div><label><span class="sr-only">Search notes</span><input type="search" id="search" placeholder="Find an observation"></label></div><p class="reading-count" id="count" aria-live="polite"></p><section class="articles" id="articles" aria-label="Articles"></section><footer class="foot">Original sample content · A starting point for your own publication.</footer></main><script>
const root=document.documentElement,theme=document.getElementById('theme'),themeKey='achernar-template:'+location.pathname;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';theme.setAttribute('aria-pressed',String(dark));theme.setAttribute('aria-label',dark?'Use light theme':'Use dark theme')}
let saved;try{saved=localStorage.getItem(themeKey)}catch{}setTheme(saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
theme.addEventListener('click',()=>{setTheme(root.dataset.theme!=='dark');try{localStorage.setItem(themeKey,root.dataset.theme)}catch{}});
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


const articles=[{id:1,category:'Design',time:'4 min read',title:'The space between things is part of the work.',summary:'Spacing is a quiet way of telling a reader what belongs together, and what needs a pause.',body:'Start with the relationship between elements. A title and its description belong close together; a new idea deserves a longer breath. Use a small set of distances, then test them with the actual content. A beautifully empty mock-up is not enough: try the longest title, the missing image, and the hurried reader.'},{id:2,category:'Practice',time:'3 min read',title:'A useful note leaves a trail.',summary:'Keep the decision, its context, and the question that remains.',body:'A note becomes useful when someone can pick up the thread without its author in the room. Record the evidence you saw and the choice it informed. Link the source. Leave room for a future correction, rather than polishing uncertainty into certainty.'},{id:3,category:'Design',time:'5 min read',title:'Make the ordinary action easy.',summary:'The everyday path should ask for less attention, not more.',body:'Watch the action that happens twenty times a day. Remove the unnecessary choice, keep the label stable, and make the result visible. A clear focus state and a predictable return path can matter more than a new feature.'}];
let category='All';const search=document.getElementById('search');function render(){const visible=articles.filter(a=>(category==='All'||a.category===category)&&(a.title+' '+a.summary).toLowerCase().includes(search.value.trim().toLowerCase()));document.getElementById('count').textContent=visible.length+' observations';document.getElementById('articles').innerHTML=visible.length?visible.map(a=>'<details class="article"><summary><span class="eyebrow">'+a.category+' / '+a.time+'</span><h2>'+escapeHTML(a.title)+'</h2><p>'+escapeHTML(a.summary)+'</p><span class="read">Read observation</span></summary><div class="body"><p>'+escapeHTML(a.body)+'</p></div></details>').join(''):'<p class="empty">No observations match this search.</p>'}search.addEventListener('input',render);document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.category;document.querySelectorAll('[data-category]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));render()}));render();
</script></body></html>
