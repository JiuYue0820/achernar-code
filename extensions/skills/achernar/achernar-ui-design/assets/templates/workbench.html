<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldwork — Project workbench</title><style>
:root{color-scheme:light;--bg:#f7f7f5;--surface:#fff;--soft:#eeefeb;--ink:#242623;--muted:#666b63;--line:#dcded7;--accent:#3e604e;--inverse:#fff;--shadow:0 8px 32px #20251b0a}
:root[data-theme=dark]{color-scheme:dark;--bg:#141314;--surface:#1d1c1d;--soft:#292829;--ink:#e9e7e8;--muted:#a5a3a4;--line:#393739;--accent:#b4c9b6;--inverse:#1d251e;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,summary{cursor:pointer}button,a,input,select,summary{outline-offset:4px}a{color:inherit}button{border:0;background:transparent;border-radius:6px;padding:9px 13px}button:hover{background:var(--soft)}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}:focus-visible{outline:2px solid var(--accent)}input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0}input[type=search]{width:100%;max-width:300px}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4vw,48px);line-height:1.1;letter-spacing:-1.4px;font-weight:600}h2{font-size:20px;line-height:1.4;font-weight:600}h3{font-size:17px;font-weight:600}small,.muted{color:var(--muted)}small{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:600;color:var(--muted)}.brand{font-size:19px;font-weight:600;letter-spacing:-.7px;text-decoration:none}.theme{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.theme svg{width:17px;height:17px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:23px 0;border-bottom:1px solid var(--line)}.heading{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:52px 0 32px}.heading p{margin-top:16px;max-width:55ch;color:var(--muted)}.toolbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.filters{display:flex;gap:4px;flex-wrap:wrap}.filters button{padding:7px 14px;font-size:13px}.page{max-width:1200px;padding:0 36px 40px;margin:auto}.empty{padding:40px;color:var(--muted)}[hidden]{display:none!important}.foot{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}::selection{background:var(--ink);color:var(--bg)}@media(max-width:720px){.page{padding:0 20px 30px}.heading{margin:36px 0 28px;align-items:start;flex-direction:column}.top{padding:17px 0}input[type=search]{max-width:none}.toolbar{align-items:stretch}.filters{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


.shell{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}.rail{padding:28px 22px;background:var(--soft);display:flex;flex-direction:column;gap:38px}.rail nav{display:grid;gap:8px}.rail a{padding:9px 12px;text-decoration:none;border-radius:5px;font-size:14px}.rail a[aria-current=page]{background:var(--surface);box-shadow:var(--shadow)}.rail small{margin-top:auto}.workspace{padding:0 36px 36px;min-width:0}.workspace .heading{margin-top:36px}.count{font-variant-numeric:tabular-nums}.board{display:grid;grid-template-columns:minmax(0,1fr) 260px;margin-top:24px;border-top:1px solid var(--line)}.list{padding-right:28px;min-width:0}.item{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;border-radius:0;padding:20px 12px;border-bottom:1px solid var(--line)}.item strong{display:block;font-weight:600}.item[aria-pressed=true]{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 var(--accent)}.badge{font-size:11px;padding:2px 8px;background:var(--soft);border-radius:4px;align-self:center;white-space:nowrap}.detail{padding:26px 0 26px 24px;border-left:1px solid var(--line);overflow-wrap:anywhere}.detail h2{margin:18px 0 12px}.detail dl{display:grid;grid-template-columns:1fr 1fr;margin-top:26px;font-size:13px;gap:14px}.detail dt{color:var(--muted)}.detail dd{margin:0;text-align:right}.detail p{font-size:14px;color:var(--muted)}@media(max-width:1050px){.board{grid-template-columns:1fr}.list{padding:0}.detail{border-left:0;padding:28px 12px}.detail dl{max-width:360px}}@media(max-width:720px){.shell{display:block}.rail{padding:16px 20px;flex-direction:row;align-items:center;justify-content:space-between;gap:16px}.rail nav{display:flex}.rail small{display:none}.workspace{padding:0 20px 28px}.item{grid-template-columns:1fr}.badge{justify-self:start}.workspace .heading{margin-top:28px}}
</style></head><body><div class="shell"><aside class="rail"><a class="brand" href="#main">Fieldwork<span aria-hidden="true"> /</span></a><nav aria-label="Workspace"><a href="#main" aria-current="page">Projects</a><a href="#detail">Details</a></nav><small>Personal workspace<br>Local demonstration</small></aside><main class="workspace" id="main"><header class="top"><span class="eyebrow">Workspace / Projects</span><button class="theme" id="theme" type="button" aria-label="Use dark theme" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span>Theme</span></button></header><div class="heading"><div><p class="eyebrow">A little room to focus</p><h1>Your next steps.</h1><p>Keep the active work in sight. Give everything else a place.</p></div><span class="muted count" id="count" aria-live="polite"></span></div><div class="toolbar"><label><span class="sr-only">Search projects</span><input id="search" type="search" placeholder="Search projects"></label><div class="filters" aria-label="Filter projects"><button data-filter="All" aria-pressed="true">All</button><button data-filter="Active" aria-pressed="false">Active</button><button data-filter="Planned" aria-pressed="false">Planned</button></div></div><div class="board"><section class="list" id="list" aria-label="Projects"></section><aside class="detail" id="detail" aria-label="Selected project" aria-live="polite"></aside></div><footer class="foot">Sample projects · Select a row to explore its details.</footer></main></div><script>
const root=document.documentElement,theme=document.getElementById('theme'),themeKey='achernar-template:'+location.pathname;
function setTheme(dark){root.dataset.theme=dark?'dark':'light';theme.setAttribute('aria-pressed',String(dark));theme.setAttribute('aria-label',dark?'Use light theme':'Use dark theme')}
let saved;try{saved=localStorage.getItem(themeKey)}catch{}setTheme(saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
theme.addEventListener('click',()=>{setTheme(root.dataset.theme!=='dark');try{localStorage.setItem(themeKey,root.dataset.theme)}catch{}});
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));


const items=[{id:'01',title:'A quieter reading space',status:'Active',kind:'Product design',owner:'You',due:'28 Sep',note:'Refine the reading rhythm, then validate the mobile layout with a real long-form article.'},{id:'02',title:'Research library',status:'Active',kind:'Knowledge systems',owner:'You',due:'30 Sep',note:'Organize sources by question. Keep citations attached to their evidence.'},{id:'03',title:'Weekly studio notes',status:'Planned',kind:'Writing',owner:'You',due:'02 Oct',note:'Collect decisions and small observations from the week.'},{id:'04',title:'Archive and handover',status:'Planned',kind:'Operations',owner:'You',due:'05 Oct',note:'Prepare a readable index of completed work, with ownership and next actions.'}];
let filter='All',selected='01';const list=document.getElementById('list'),search=document.getElementById('search');
function selectItem(id){selected=id;render()}
function render(){const visible=items.filter(i=>(filter==='All'||i.status===filter)&&i.title.toLowerCase().includes(search.value.trim().toLowerCase()));if(!visible.some(i=>i.id===selected))selected=visible[0]?.id;document.getElementById('count').textContent=visible.length+' projects';list.innerHTML=visible.length?visible.map(i=>'<button class="item" data-id="'+i.id+'" aria-pressed="'+(i.id===selected)+'"><span><small>'+i.id+' / '+escapeHTML(i.kind)+'</small><strong>'+escapeHTML(i.title)+'</strong></span><span class="badge">'+escapeHTML(i.status)+'</span></button>').join(''):'<p class="empty">No projects match. Try another search or filter.</p>';const i=visible.find(i=>i.id===selected);document.getElementById('detail').innerHTML=i?'<span class="eyebrow">Project '+i.id+'</span><h2>'+escapeHTML(i.title)+'</h2><p>'+escapeHTML(i.note)+'</p><dl><dt>Status</dt><dd>'+i.status+'</dd><dt>Owner</dt><dd>'+i.owner+'</dd><dt>Next check-in</dt><dd>'+i.due+'</dd></dl>':'<p>Select a project after clearing the filter.</p>'}
list.addEventListener('click',e=>{const row=e.target.closest('[data-id]');if(row){selectItem(row.dataset.id);list.querySelector('[data-id="'+selected+'"]').focus()}});search.addEventListener('input',render);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));render()}));render();
</script></body></html>
